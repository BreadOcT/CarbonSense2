<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Masuk Administrator - CarbonSense</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-[#F0F9FF] text-[#0F172A] font-sans min-h-screen flex flex-col justify-between grid-backdrop relative overflow-hidden" id="admin-login-body">

  <!-- Header -->
  <header class="w-full border-b border-slate-200 bg-white/90 backdrop-blur-md relative z-10 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-[#0284C7] text-white flex items-center justify-center font-bold shadow-md shadow-[#0284C7]/25">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <span class="font-display text-2xl tracking-wider text-[#0F172A]">CarbonSense Admin</span>
      </a>

      <a href="index.html" class="text-xs uppercase tracking-wider font-semibold text-[#475569] hover:text-[#0284C7] border border-slate-200 bg-white px-4 py-2 rounded-xl transition">
        &larr; Beranda Utama
      </a>
    </div>
  </header>

  <!-- Login Box -->
  <main class="flex-1 flex items-center justify-center p-6 my-8 relative z-10">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl border border-slate-200 shadow-xl relative">
      
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-[#E0F2FE] border border-[#0284C7]/30 text-[#0284C7] flex items-center justify-center mx-auto mb-4 shadow-sm">
          <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-[#0F172A] font-display tracking-wider">Admin Portal Access</h1>
        <p class="text-xs text-[#475569] mt-1">Konsol Manajemen Inventori & Pendaftaran Hardware IoT</p>
      </div>

      <!-- Quick Test Fill Button -->
      <div class="mb-6 p-3.5 rounded-xl bg-[#F0F9FF] border border-[#0284C7]/30 flex items-center justify-between">
        <div>
          <div class="text-[11px] font-bold text-[#0284C7] uppercase tracking-wider">Kredensial Admin Demo</div>
          <div class="text-xs text-[#475569]">admin@carbonsense.id / admin123</div>
        </div>
        <button type="button" onclick="fillAdminDemo()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-[#0284C7] text-white hover:bg-[#0369A1] transition shadow-sm">
          Auto Fill
        </button>
      </div>

      <!-- Error alert -->
      <div id="admin-error" class="hidden mb-6 p-4 rounded-xl bg-[#FEE2E2] border border-[#DC2626]/30 text-[#DC2626] font-medium text-xs"></div>

      <form id="admin-login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-[#475569] mb-1.5">Admin ID / Email</label>
          <input 
            type="email" 
            id="admin-email" 
            required 
            placeholder="admin@carbonsense.id" 
            class="w-full px-4 py-3 rounded-xl bg-white border border-slate-300 text-[#0F172A] text-sm focus:outline-none focus:border-[#0284C7] transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-[#475569] mb-1.5">Kata Sandi Pengelola</label>
          <input 
            type="password" 
            id="admin-password" 
            required 
            placeholder="••••••••" 
            class="w-full px-4 py-3 rounded-xl bg-white border border-slate-300 text-[#0F172A] text-sm focus:outline-none focus:border-[#0284C7] transition"
          />
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 rounded-xl font-bold text-sm tracking-wide btn-primary shadow-lg shadow-[#0284C7]/20 transition mt-2"
        >
          Masuk ke Konsol Admin
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-200 text-center text-xs text-[#475569]">
        Bukan administrator? 
        <a href="login.html" class="text-[#0284C7] font-bold hover:underline ml-1">Masuk sebagai Pengguna Biasa</a>
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-[#475569] border-t border-slate-200 bg-white relative z-10">
    CarbonSense Decoupled Testing Site &bull; Administrator Access Control
  </footer>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/testing-nav.js"></script>
  <script>
    function fillAdminDemo() {
      document.getElementById('admin-email').value = 'admin@carbonsense.id';
      document.getElementById('admin-password').value = 'admin123';
      document.getElementById('admin-error').classList.add('hidden');
    }

    document.getElementById('admin-login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('admin-error');

      if (!email || !password) {
        errorEl.textContent = 'Harap lengkapi semua kolom input admin.';
        errorEl.classList.remove('hidden');
        return;
      }

      // Allow login
      window.location.href = 'admin-dashboard.html';
    });
  </script>
</body>
</html>
